name: 生产工作台回归测试

on:
  push:
    branches: [main]
    paths:
      - 'scripts/production-parallel/**'
      - 'scripts/group-companion/openclaw-gate.mjs'
      - 'scripts/group-companion/test_openclaw_gate_display.mjs'
      - 'scripts/build_production_dashboard.py'
      - 'scripts/publish_production_dashboard.py'
      - 'scripts/test_production_dashboard.py'
      - 'docs/dashboard.template.html'
      - 'docs/production-dashboard.html'
      - '.github/workflows/production-parallel-tests.yml'
  pull_request:
    paths:
      - 'scripts/production-parallel/**'
      - 'scripts/group-companion/openclaw-gate.mjs'
      - 'scripts/group-companion/test_openclaw_gate_display.mjs'
      - 'scripts/build_production_dashboard.py'
      - 'scripts/publish_production_dashboard.py'
      - 'scripts/test_production_dashboard.py'
      - 'docs/dashboard.template.html'
      - 'docs/production-dashboard.html'
      - '.github/workflows/production-parallel-tests.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: 准备真实台账测试样本
        run: |
          cp '袜子生产制造袜子厂/库存记录/2026下半年下机白胚半成品统计.md' /tmp/ledger-current.md
      - name: 运行完整生产回归（含正常报数、历史补核和防重放）
        working-directory: scripts/production-parallel
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -p 'test_*.py' -q
      - name: 运行手机和电脑发布快照回归
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p test_production_dashboard.py -v
      - name: 运行更正显示与只读查询入口回归
        run: node --test scripts/group-companion/test_openclaw_gate_display.mjs
