<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>袜子生产统计工作台</title>
<style>
:root{font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202124;background:#f6f8fb}body{margin:0;padding:28px}main{max-width:1100px;margin:auto;background:#fff;border:1px solid #d9e0ea;border-radius:16px;padding:28px;box-shadow:0 8px 24px #1e375a14}h1{margin:0 0 4px;font-size:28px}.sub,.muted{color:#6b7280}.banner{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;background:#eef7f1;border:1px solid #cce8d5;border-radius:10px;padding:12px 16px;margin:22px 0;color:#176b3a}.banner.error{background:#fff4f2;border-color:#f2c7c2;color:#a5281b}.alert-stack{display:grid;gap:8px;margin:-8px 0 18px}.alert{border:1px solid;border-radius:10px;padding:10px 14px}.alert.ok{background:#eef7f1;border-color:#cce8d5;color:#176b3a}.alert.warn{background:#fff7ed;border-color:#fed7aa;color:#9a3412}.alert.error{background:#fff4f2;border-color:#f2c7c2;color:#a5281b}table{border-collapse:collapse;width:100%;table-layout:fixed;margin:10px 0 26px}.detail-table{font-size:13px}.detail-table th,.detail-table td{padding:9px 6px}.detail-table th:nth-child(n),.detail-table td:nth-child(n){width:auto}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #e5eaf0;overflow-wrap:anywhere}th{background:#f3f6fa;color:#4b5563}th:nth-child(1),td:nth-child(1){width:16%}th:nth-child(2),td:nth-child(2){width:25%}th:nth-child(3),td:nth-child(3){width:25%}th:nth-child(4),td:nth-child(4){width:34%;white-space:normal}.ok{color:#147a43;font-weight:600}.bad{color:#a5281b;font-weight:600}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#f7f9fc;border:1px solid #e4e9f0;border-radius:10px;padding:14px}.card b{display:block;font-size:20px;margin-top:5px}@media(max-width:700px){body{padding:12px}main{padding:18px}.cards{grid-template-columns:1fr}th,td{padding:10px 7px;font-size:13px}th:nth-child(2),td:nth-child(2){width:23%}th:nth-child(3),td:nth-child(3){width:25%}th:nth-child(4),td:nth-child(4){width:36%}}
.alert.info{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
.status-content{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.business-pending{display:inline-flex;align-items:center;max-width:100%;box-sizing:border-box;padding:3px 9px;border:1px solid #bfdbfe;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:600;line-height:1.6}
.waiting{color:#9a3412;font-weight:600}
.freshness{display:flex;gap:14px;flex-wrap:wrap;margin:-12px 0 18px;color:#64748b;font-size:13px}
.task-health{margin:-8px 0 18px;padding:10px 14px;border:1px solid #dbe5f0;border-radius:10px;background:#f8fafc;color:#475569;font-size:14px}
.task-health.ok{background:#eef7f1;border-color:#cce8d5;color:#176b3a}
.task-health.error{background:#fff4f2;border-color:#f2c7c2;color:#a5281b}
</style>
<main><h1>袜子生产统计工作台</h1><div class="sub">2026 年下半年 · 单位：双</div><div id="banner" class="banner">正在读取最新状态…</div><div id="freshness" class="freshness" aria-live="polite">台账快照：读取中…</div><div id="alerts" class="alert-stack" aria-live="polite"></div><div id="task-health" class="task-health" aria-live="polite">上传任务：正在检查…</div><table><thead><tr><th>数据源</th><th>版本／协议</th><th>同步状态</th><th>最后同步成功时间（北京时间）</th></tr></thead><tbody id="sync"><tr><td colspan="4">正在读取…</td></tr></tbody></table><h2>每日生产产品明细</h2><p class="muted">最近显示3天；A/B每月1日、16日换班，白班07:00–19:00，夜班19:00–次日07:00。</p><div id="overview"></div><p class="muted">页面每 30 秒刷新台账快照；GitHub 更新并完成 Cloudflare 自动构建后显示最新数据。 <span id="next-refresh">下次刷新：30 秒</span></p></main>
<script>
let md=window.__LEDGER__||'';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cn=t=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(t).replaceAll('/','-');
function shiftFor(date,person){
  const isA=/A\s*[｜|]\s*徐超超/.test(person), isB=/B\s*[｜|]\s*梅芳/.test(person);
  if(!isA&&!isB)return '白天/不固定';
  const day=Number(date.slice(8,10));
  const aIsDay=day>=16;
  const isDay=isA?aIsDay:!aIsDay;
  return isDay?'白班':'夜班';
}
function syncRowsFromLedger(){
  const section=(md.match(/### 同步状态([\s\S]*?)(?=### 异常检查|$)/)||[])[1]||'';
  const rows=[];
  for(const row of section.matchAll(/\|\s*(GitHub|OpenClaw|飞书)\s*\|\s*([^|]+)\|\s*([^|]+)\|\s*(20\d{2}-\d{2}-\d{2}\s+\d{2}:\d{2})\s*\|/g)){
    rows.push({source:row[1],version:row[2].trim(),status:row[3].trim(),time:row[4].trim()});
  }
  return rows;
}
function renderAlerts(stamp,syncRows){
  const alerts=[];
  const checkSection=(md.match(/### 异常检查([\s\S]*?)(?=\n## |\n<a id=|$)/)||[])[1]||'';
  const pending=Number((checkSection.match(/\|\s*待核实日期\s*\|\s*(\d+)/)||[])[1]||0);
  const conflicts=Number((checkSection.match(/\|\s*状态冲突\s*\|\s*(\d+)/)||[])[1]||0);
  const versions=(checkSection.match(/\|\s*三端规则版本\s*\|\s*([^|]+)/)||[])[1]?.trim();
  for(const row of syncRows){
    if(/失败|异常|卡住|阻塞/.test(row.status))alerts.push({kind:'error',text:`异常告警：${row.source}：${row.status}。`});
    else if(row.source==='飞书'&&/等待核实/.test(row.status))alerts.push({kind:'info',text:`等待员工核实：飞书${row.status}；此项为业务待处理。`});
    else if(/处理中|等待|待核实|待同步/.test(row.status))alerts.push({kind:'warn',text:`状态提示：${row.source}：${row.status}。`});
  }
  if(conflicts>0)alerts.push({kind:'error',text:`异常告警：发现${conflicts}条状态冲突。`});
  if(pending>0)alerts.push({kind:'info',text:`待核实：还有${pending}天生产记录等待核对。`});
  if(versions&&versions!=='一致')alerts.push({kind:'error',text:`版本告警：三端规则版本${versions}。`});
  const syncTime=stamp&&stamp.match(/^(20\d{2}-\d{2}-\d{2})\s+(\d{2}:\d{2}(?::\d{2})?)/);
  if(syncTime){
    const synced=Date.parse(`${syncTime[1]}T${syncTime[2]}+08:00`), age=Date.now()-synced;
    if(age>15*60*1000&&age<7*24*60*60*1000)alerts.push({kind:'warn',text:'同步可能卡住：台账超过15分钟没有新的成功同步。'});
  }else alerts.push({kind:'error',text:'异常告警：没有读取到台账最后同步时间。'});
  document.querySelector('#alerts').innerHTML=alerts.length?alerts.map(a=>`<div class="alert ${a.kind}">${esc(a.text)}</div>`).join(''):'<div class="alert ok">✓ 当前没有发现异常</div>';
}
function renderTaskHealth(syncRows){
  const el=document.querySelector('#task-health');
  const failed=syncRows.filter(row=>/失败|异常|卡住|阻塞|重试|reply_pending|待处理/.test(row.status));
  if(failed.length){
    el.className='task-health error';
    el.innerHTML=`⚠ 上传/回执异常任务：${failed.length} 条 · ${failed.map(row=>`${esc(row.source)}：${esc(row.status)}`).join('；')}`;
  }else{
    el.className='task-health ok';
    el.textContent='✓ 当前没有上传失败、回执失败或卡住任务';
  }
}
function refresh(){
  const now=new Date();
  try{
    if(!md)throw Error('台账内容未嵌入');
    const syncRows=syncRowsFromLedger();
    const stamp=syncRows[0]?.time||(md.match(/最后同步\s*\|\s*([^|]+)/)||[])[1]?.trim()||'台账未记录';
    document.querySelector('#banner').className='banner';
    document.querySelector('#banner').innerHTML=`<strong>● 数据同步正常</strong><span>页面最后刷新：${esc(cn(now))}</span>`;
    document.querySelector('#freshness').innerHTML=`<span>台账快照：${esc(stamp)}</span><span>页面刷新：${esc(cn(now))}</span>`;
    renderAlerts(stamp,syncRows);
    renderTaskHealth(syncRows);
    const defaults=[['GitHub','V1.17'],['OpenClaw','V1.17 / S1'],['飞书','V1.17 / CARD-INTERACTIVE-1']];
    document.querySelector('#sync').innerHTML=defaults.map(([source,version])=>{
      const row=syncRows.find(item=>item.source===source)||{source,version,status:'未记录',time:stamp};
      const bad=/失败|异常|卡住|阻塞/.test(row.status), businessPending=!bad&&row.source==='飞书'&&/等待核实/.test(row.status), pending=/处理中|等待|待核实|待同步/.test(row.status);
      const cls=bad?'bad':pending?'waiting':'ok';
      const icon=bad?'⚠':pending?'⏳':'✓';
      const count=(row.status.match(/[（(]\s*(\d+)\s*条\s*[）)]/)||[])[1];
      const label=count?`待核实 ${count} 条`:'待核实';
      const status=businessPending?`<div class="status-content"><span class="ok">✓ 同步正常</span><span class="business-pending">${esc(label)}</span></div>`:`<span class="${cls}">${icon} ${esc(row.status)}</span>`;
      return `<tr><td>${esc(row.source)}</td><td>${esc(row.version||version)}</td><td>${status}</td><td>${esc(row.time||stamp)}</td></tr>`;
    }).join('');
    const dateBlocks=[...md.matchAll(/####\s+(20\d{2}-\d{2}-\d{2})([\s\S]*?)(?=\n#{2,}\s|\n<a id=|$)/g)];
    const records=[];
    for(const d of dateBlocks){
      if(!d[2].includes('| 人员 | 工序 |'))continue;
      for(const r of d[2].matchAll(/\|\s*([^|]+)\s*\|\s*(下机|烤边)\s*\|\s*([^|]+)\s*\|\s*([^|]+)\s*\|\s*([^|]+)\s*\|\s*([^|]+)\s*\|\s*([^|]+)\s*\|\s*([^|]+)\s*\|\s*([^|]+)\s*\|/g)){
        records.push({date:d[1],person:r[1].trim(),process:r[2],values:r.slice(3).map(x=>x.trim())});
      }
    }
    const latestDates=[...new Set(records.map(r=>r.date))].sort().reverse().slice(0,3);
    const makeTable=(title,rows)=>rows.length?`<h3>${title}</h3><div style="overflow:auto"><table class="detail-table"><thead><tr><th>日期</th><th>班次</th><th>人员</th><th>棉堆堆袜</th><th>冰冰袜</th><th>小腿袜</th><th>过膝袜</th><th>女船袜</th><th>男船袜</th><th>小计</th></tr></thead><tbody>${rows.filter(r=>latestDates.includes(r.date)).map(r=>`<tr><td>${r.date}</td><td>${shiftFor(r.date,r.person)}</td><td>${esc(r.person)}</td>${r.values.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="muted">暂无记录</p>';
    document.querySelector('#overview').innerHTML=makeTable('下机',records.filter(r=>r.process==='下机'))+makeTable('烤边',records.filter(r=>r.process==='烤边'));
  }catch(e){const b=document.querySelector('#banner');b.className='banner error';b.textContent='读取失败：'+e.message;}
}
refresh();let seconds=30;setInterval(()=>{seconds--;const el=document.querySelector("#next-refresh");if(el)el.textContent=`下次刷新：${seconds} 秒`;if(seconds<=0)location.reload();},1000);
</script>
