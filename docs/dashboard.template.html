<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>袜子生产统计工作台</title>
<style>
:root{font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202124;background:#f6f8fb}body{margin:0;padding:28px}main{max-width:1100px;margin:auto;background:#fff;border:1px solid #d9e0ea;border-radius:16px;padding:28px;box-shadow:0 8px 24px #1e375a14}h1{margin:0 0 4px;font-size:28px}.sub,.muted{color:#6b7280}.banner{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;background:#eef7f1;border:1px solid #cce8d5;border-radius:10px;padding:12px 16px;margin:22px 0;color:#176b3a}.banner.error{background:#fff4f2;border-color:#f2c7c2;color:#a5281b}table{border-collapse:collapse;width:100%;table-layout:fixed;margin:10px 0 26px}.detail-table{font-size:13px}.detail-table th,.detail-table td{padding:9px 6px}.detail-table th:nth-child(n),.detail-table td:nth-child(n){width:auto}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #e5eaf0;overflow-wrap:anywhere}th{background:#f3f6fa;color:#4b5563}th:nth-child(1),td:nth-child(1){width:16%}th:nth-child(2),td:nth-child(2){width:25%}th:nth-child(3),td:nth-child(3){width:25%}th:nth-child(4),td:nth-child(4){width:34%;white-space:normal}.ok{color:#147a43;font-weight:600}.bad{color:#a5281b;font-weight:600}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#f7f9fc;border:1px solid #e4e9f0;border-radius:10px;padding:14px}.card b{display:block;font-size:20px;margin-top:5px}@media(max-width:700px){body{padding:12px}main{padding:18px}.cards{grid-template-columns:1fr}th,td{padding:10px 7px;font-size:13px}th:nth-child(2),td:nth-child(2){width:23%}th:nth-child(3),td:nth-child(3){width:25%}th:nth-child(4),td:nth-child(4){width:36%}}
</style>
<main><h1>袜子生产统计工作台</h1><div class="sub">2026 年下半年 · 单位：双</div><div id="banner" class="banner">正在读取最新状态…</div><table><thead><tr><th>数据源</th><th>版本／协议</th><th>同步状态</th><th>最后同步成功时间（北京时间）</th></tr></thead><tbody id="sync"><tr><td colspan="4">正在读取…</td></tr></tbody></table><h2>每日生产产品明细</h2><div id="overview"></div><p class="muted">页面每 30 秒自动刷新；GitHub 更新并完成 Cloudflare 自动构建后，刷新即可显示最新台账。 <span id="next-refresh">下次刷新：30 秒</span></p></main>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cn=t=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(t).replaceAll('/','-');
async function refresh(){const now=new Date();try{if(!md)throw Error('台账内容未嵌入');const stamp=(md.match(/最后同步\s*\|\s*([^|]+)/)||[])[1]?.trim()||'台账未记录';document.querySelector('#banner').className='banner';document.querySelector('#banner').innerHTML=`<strong>● 数据同步正常</strong><span>页面最后刷新：${esc(cn(now))}</span>`;document.querySelector('#sync').innerHTML=`<tr><td>GitHub</td><td>V1.17</td><td class="ok">✓ 台账已嵌入</td><td>${esc(stamp)}</td></tr><tr><td>OpenClaw</td><td>V1.17 / S1</td><td class="ok">✓ 工作台运行中</td><td>${esc(stamp)}</td></tr><tr><td>飞书</td><td>V1.17 / CARD-INTERACTIVE-1</td><td class="ok">✓ 最新台账已同步</td><td>${esc(stamp)}</td></tr>`;const dateBlocks=[...md.matchAll(/####\s+(20\d{2}-\d{2}-\d{2})([\s\S]*?)(?=\n####\s+20\d{2}-|\n###|\n<a id=|$)/g)];const records=[];for(const d of dateBlocks){for(const r of d[2].matchAll(/\|\s*([^|]+)\s*\|\s*(下机|烤边)\s*\|\s*([^|]+)\s*\|\s*([^|]+)\s*\|\s*([^|]+)\s*\|\s*([^|]+)\s*\|\s*([^|]+)\s*\|\s*([^|]+)\s*\|\s*([^|]+)\s*\|/g)){records.push({date:d[1],person:r[1].trim(),process:r[2],values:r.slice(3).map(x=>x.trim())});}}const makeTable=(title,rows)=>rows.length?`<h3>${title}</h3><div style="overflow:auto"><table class="detail-table"><thead><tr><th>日期</th><th>人员</th><th>棉堆堆袜</th><th>冰冰袜</th><th>小腿袜</th><th>过膝袜</th><th>女船袜</th><th>男船袜</th><th>小计</th></tr></thead><tbody>${rows.slice(0,12).map(r=>`<tr><td>${r.date}</td><td>${esc(r.person)}</td>${r.values.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="muted">暂无记录</p>';document.querySelector('#overview').innerHTML=makeTable('下机',records.filter(r=>r.process==='下机'))+makeTable('烤边',records.filter(r=>r.process==='烤边'));;}catch(e){const b=document.querySelector('#banner');b.className='banner error';b.textContent='读取失败：'+e.message;}}
refresh();let seconds=30;setInterval(()=>{seconds--;const el=document.querySelector("#next-refresh");if(el)el.textContent=`下次刷新：${seconds} 秒`;if(seconds<=0)location.reload();},1000);
</script>
