<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>袜子生产统计工作台</title>
<style>
:root{font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202124;background:#f6f8fb}body{margin:0;padding:28px}main{max-width:1100px;margin:auto;background:#fff;border:1px solid #d9e0ea;border-radius:16px;padding:28px;box-shadow:0 8px 24px #1e375a14}h1{margin:0 0 4px;font-size:28px}.sub,.muted{color:#6b7280}.banner{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;background:#eef7f1;border:1px solid #cce8d5;border-radius:10px;padding:12px 16px;margin:22px 0;color:#176b3a}.banner.error{background:#fff4f2;border-color:#f2c7c2;color:#a5281b}table{border-collapse:collapse;width:100%;margin:10px 0 26px}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid #e5eaf0}th{background:#f3f6fa;color:#4b5563}.ok{color:#147a43;font-weight:600}.bad{color:#a5281b;font-weight:600}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#f7f9fc;border:1px solid #e4e9f0;border-radius:10px;padding:14px}.card b{display:block;font-size:20px;margin-top:5px}@media(max-width:700px){body{padding:12px}main{padding:18px}.cards{grid-template-columns:1fr}th,td{padding:10px 7px;font-size:13px}}
</style>
<main><h1>袜子生产统计工作台</h1><div class="sub">2026 年下半年 · 单位：双</div><div id="banner" class="banner">正在读取最新状态…</div><table><thead><tr><th>数据源</th><th>版本／协议</th><th>同步状态</th><th>最后同步成功时间（北京时间）</th></tr></thead><tbody id="sync"><tr><td colspan="4">正在读取…</td></tr></tbody></table><h2>生产概览</h2><div id="overview" class="cards"></div><p class="muted">页面每 30 秒自动读取 GitHub 最新版本；页面刷新时间与各平台最后成功同步时间分开显示。</p></main>
<script>
const owner='xianer-AI',repo='xianer-ai-brain',path='袜子生产制造袜子厂/库存记录/2026下半年下机白胚半成品统计.md';
const api=`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cn=t=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(t).replaceAll('/','-');
async function refresh(){const now=new Date();try{const r=await fetch(api+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('GitHub HTTP '+r.status);const j=await r.json();const md=decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))));const stamp=(md.match(/最后同步\s*\|\s*([^|]+)/)||[])[1]?.trim()||'台账未记录';const commit=new Date(j.git_url?Date.now():now);document.querySelector('#banner').className='banner';document.querySelector('#banner').innerHTML=`<strong>● 数据同步正常</strong><span>页面最后刷新：${esc(cn(now))}</span>`;document.querySelector('#sync').innerHTML=`<tr><td>GitHub</td><td>V1.17</td><td class="ok">✓ 台账已读取</td><td>${esc(stamp)}</td></tr><tr><td>OpenClaw</td><td>V1.17 / S1</td><td class="ok">✓ 工作台运行中</td><td>${esc(stamp)}</td></tr><tr><td>飞书</td><td>V1.17 / CARD-INTERACTIVE-1</td><td class="ok">✓ 最新台账已同步</td><td>${esc(stamp)}</td></tr>`;const m=md.match(/\| B｜梅芳 \| 下机 \| ([^|]+) \| ([^|]+) \| ([^|]+) \|/);document.querySelector('#overview').innerHTML=`<div class="card"><span class="muted">梅芳最新棉堆堆袜</span><b>${esc(m?.[1]||'—')} 双</b></div><div class="card"><span class="muted">梅芳最新冰冰袜</span><b>${esc(m?.[2]||'—')} 双</b></div><div class="card"><span class="muted">数据读取来源</span><b>GitHub main</b></div>`;}catch(e){const b=document.querySelector('#banner');b.className='banner error';b.textContent='读取失败：'+e.message;}}
refresh();setInterval(refresh,30000);
</script>
